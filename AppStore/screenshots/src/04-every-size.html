.ripple{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.9);background:rgba(255,255,255,.16);box-shadow:0 0 0 22px rgba(255,255,255,.10),0 0 0 48px rgba(255,255,255,.05)}
