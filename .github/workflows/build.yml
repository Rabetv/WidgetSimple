name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode is a release; the newest installed one can be a
      # beta, and App Store Connect rejects builds made with a beta.
      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Build app + widget (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project WidgetSimple.xcodeproj \
            -scheme WidgetSimple \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
