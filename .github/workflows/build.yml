name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # hook = AltStore/TestFlight build with the private-API hook;
        # appstore = App Review build (see RELEASES.md). Both must stay green.
        flavour: [hook, appstore]
    name: build (${{ matrix.flavour }})
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode is a release; the newest installed one can be a
      # beta, and App Store Connect rejects builds made with a beta.
      - name: Xcode version
        run: |
          xcodebuild -version

      - name: Build app + widget (unsigned, device SDK)
        env:
          FLAVOUR: ${{ matrix.flavour }}
        run: |
          set -o pipefail
          EXTRA=()
          if [ "$FLAVOUR" = "appstore" ]; then
            # Same settings as the TestFlight appstore archive. Swift reads
            # SWIFT_ACTIVE_COMPILATION_CONDITIONS, Objective-C reads the GCC ones.
            EXTRA=(HOME_SCREEN_NAME=WidgetSimple GCC_PREPROCESSOR_DEFINITIONS=APPSTORE=1 SWIFT_ACTIVE_COMPILATION_CONDITIONS=APPSTORE)
          fi
          xcodebuild \
            -project WidgetSimple.xcodeproj \
            -scheme WidgetSimple \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ${EXTRA[@]+"${EXTRA[@]}"} \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Audit App Store build (no private API)
        if: matrix.flavour == 'appstore'
        run: |
          set -o pipefail
          Scripts/audit-appstore.sh DerivedData/Build/Products/Release-iphoneos/WidgetSimple.app 2>&1 | tee audit.log
          { echo '### App Store audit'; echo '```'; cat audit.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Control: the hook build must contain what the audit looks for, otherwise a
      # passing audit above proves nothing.
      - name: Audit control (hook build contains the hook)
        if: matrix.flavour == 'hook'
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for appex in DerivedData/Build/Products/Release-iphoneos/WidgetSimple.app/PlugIns/*.appex; do
            bin="$appex/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$appex/Info.plist")"
            if strings -a "$bin" | grep -F getAllCurrentDescriptorsWithCompletion; then found=1; fi
          done
          [ "$found" -eq 1 ] || { echo "::error::hook not found in the hook build; the audit patterns are stale"; exit 1; }

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.flavour }}
          path: |
            build.log
            audit.log
          if-no-files-found: ignore
