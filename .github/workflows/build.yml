name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The image's default Xcode is a release; the newest installed one can be a
      # beta, and App Store Connect rejects builds made with a beta.
      - name: Xcode version
        run: |
          xcodebuild -version
          # Xcode 27+ has the iOS 27 SDK: compile in the Max widget size (see WidgetSizes).
          if [ "$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')" -ge 27 ]; then
            echo 'SDK_FLAG=SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) SDK27' >> "$GITHUB_ENV"
            echo "iOS 27 SDK: Max widget size included."
          fi

      - name: Build app + widget (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project WidgetSimple.xcodeproj \
            -scheme WidgetSimple \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ${SDK_FLAG:+"$SDK_FLAG"} \
            build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
