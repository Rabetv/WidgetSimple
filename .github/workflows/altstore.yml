name: AltStore IPA

# Builds an unsigned WidgetSimple.ipa that AltStore / AltServer signs with the
# user's own Apple ID when installing. Attach it to a GitHub release so the
# AltStore source JSON can point at it.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project WidgetSimple.xcodeproj \
            -scheme WidgetSimple \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -archivePath build/WidgetSimple.xcarchive \
            archive 2>&1 | tee archive.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" archive.log

      - name: Package IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R build/WidgetSimple.xcarchive/Products/Applications/WidgetSimple.app build/Payload/
          (cd build && zip -qry WidgetSimple.ipa Payload)
          ls -lh build/WidgetSimple.ipa
          echo "SIZE=$(stat -f%z build/WidgetSimple.ipa)" >> "$GITHUB_ENV"
          echo "### WidgetSimple.ipa: $SIZE bytes" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: WidgetSimple-ipa
          path: build/WidgetSimple.ipa

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/WidgetSimple.ipa
