<!doctype html><html lang="en"><head><meta charset="utf-8"><title>04-every-size</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;width:1320px;height:2868px;overflow:hidden;position:relative;font-family:Inter,-apple-system,sans-serif;color:#fff;background:#1a0f0b}
.bg{position:absolute;inset:0;background:url(../../../WidgetSimple/Assets.xcassets/AppBackground.imageset/AppBackground.svg) center/cover}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,9,5,.72) 0%,rgba(18,9,5,.35) 22%,rgba(18,9,5,0) 45%)}
.head{position:absolute;top:180px;left:0;right:0;text-align:center;padding:0 80px}
h1{font-size:126px;line-height:1.03;font-weight:800;letter-spacing:-3px;margin:0}
h1 em{font-style:normal;color:#FFC766}
.sub{font-size:52px;line-height:1.25;margin:34px 0 0;color:rgba(255,255,255,.85);font-weight:500}
.phone{position:absolute;left:155px;top:690px;width:1010px;height:2230px;border-radius:150px;background:#0b0b0d;padding:22px;box-shadow:0 70px 160px rgba(0,0,0,.6),inset 0 0 0 4px #3b3a3f}
.screen{width:966px;height:2186px;border-radius:130px;overflow:hidden;position:relative;background:url(../../../WidgetSimple/Assets.xcassets/AppBackground.imageset/AppBackground.svg) center/cover}
.inner{width:390px;height:883px;transform:scale(2.477);transform-origin:0 0;position:relative}
.island{position:absolute;top:11px;left:50%;margin-left:-62px;width:124px;height:36px;border-radius:18px;background:#000;z-index:5}
.time{position:absolute;top:17px;left:42px;font-size:16px;font-weight:600;z-index:5}
.g{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);box-shadow:inset 0 1px 0 rgba(255,255,255,.32),0 8px 24px rgba(0,0,0,.18);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6)}
.row{background:rgba(255,255,255,.10);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.w{font-weight:600;line-height:1.28;text-shadow:0 1px 6px rgba(0,0,0,.35)}
.muted{color:rgba(255,255,255,.75)}
.icon{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25)}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:94px;border-radius:34px;display:flex;justify-content:space-around;align-items:center}
.seg{display:grid;gap:2px;padding:2px;border-radius:9px;background:rgba(255,255,255,.12);font-size:13px;font-weight:600;text-align:center}
.seg span{padding:6px 0;border-radius:7px}
.seg .on{background:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.hdr{font-size:13px;color:rgba(255,255,255,.7);text-transform:uppercase;margin:18px 0 7px 16px}
.list{border-radius:24px;overflow:hidden}
.li{display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:0 16px;font-size:17px;border-bottom:.5px solid rgba(255,255,255,.14)}
.li:last-child{border-bottom:0}
.tap{position:absolute;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.9);box-shadow:0 0 0 10px rgba(255,255,255,.12)}
.tabbar{position:absolute;left:18px;right:18px;bottom:26px;height:62px;border-radius:31px;display:grid;grid-template-columns:repeat(3,1fr);align-items:center;padding:0 6px;font-size:10px;font-weight:600;text-align:center}
.tabbar div{display:flex;flex-direction:column;align-items:center;gap:3px;height:52px;justify-content:center;border-radius:26px}
.tabbar .on{background:rgba(255,255,255,.18);color:#FFC766}
</style></head><body><div class="bg"></div>
<div class="head"><h1>Small<br><em>to large.</em></h1><p class="sub">One look for every widget size.</p></div>
<div class="phone"><div class="screen"><div class="inner"><div class="island"></div><div class="time">9:41</div>

<div style="position:absolute;top:66px;left:22px;right:22px;display:flex;flex-direction:column;gap:22px">
<div style="display:flex;gap:22px">
<div class="g" style="width:162px;height:162px;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px"><span style="font-size:30px;font-weight:300;line-height:1">9:41</span><div class="w" style="display:grid;grid-template-columns:repeat(1,minmax(0,1fr));column-gap:18px;font-size:15px;color:#fff;"><span>Messages</span><span>Notes</span><span>Camera</span></div></div>
<div style="display:grid;grid-template-columns:repeat(2,62px);gap:16px 38px;padding:6px 0 0 0"><div class="icon"></div><div class="icon"></div><div class="icon"></div><div class="icon"></div></div>
</div>
<div class="g" style="width:346px;height:162px;border-radius:24px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:4px"><div class="w" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;font-size:19px;color:#fff;"><span>Messages</span><span>Notes</span><span>Camera</span><span>Maps</span></div></div>
<div class="g" style="width:346px;height:346px;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;justify-content:flex-start;gap:4px"><span style="font-size:13px;font-weight:600;color:#FFC766">THURSDAY 23</span><span style="font-size:48px;font-weight:300;letter-spacing:-1.5px;line-height:1.05">9:41</span><div class="w" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:18px;font-size:20px;color:#fff;row-gap:4px;margin-top:8px"><span>Messages</span><span>Notes</span><span>Camera</span><span>Maps</span><span>Music</span><span>Mail</span><span>Photos</span><span>Calendar</span></div></div>
</div>
</div></div></div></body></html>
